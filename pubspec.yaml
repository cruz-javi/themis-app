name: themis_app
description: "Themis - aplicacion movil del votante"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_dotenv: ^5.2.1
  go_router: ^14.6.2
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Usados directamente en test/voting/ballot_page_test.dart para fakear la
  # plataforma de flutter_secure_storage (sin esto, SecureIdentityStore
  # intenta hablar por platform channel y el widget test falla).
  flutter_secure_storage_platform_interface: ^1.1.2
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  assets:
    - assets/.env
    - assets/semaphore/identity.html
    - assets/semaphore/identity.bundle.js
